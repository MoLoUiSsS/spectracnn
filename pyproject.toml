[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spectracnn"
version = "0.1.0"
description = "RF modulation classification for 5G/6G with a PyTorch 1D CNN"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hammadi Mohammed" }]
keywords = ["cnn", "pytorch", "5g", "modulation-classification", "signal-processing", "mlops"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=1.26,<3",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "torch>=2.4,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "matplotlib>=3.9,<4",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "scikit-learn>=1.5,<2",
]
mlops = ["mlflow>=2.16,<4"]

[project.scripts]
spectracnn-train = "spectracnn.train:main"
spectracnn-serve = "spectracnn.asgi:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "PTH"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["spectracnn"]
omit = ["src/spectracnn/asgi.py"]
